# National crawl on GitHub Actions (public repo: free runners). Runs the resumable chunk scripts every two hours and
# commits the data back; narthexlabs/fold-app syncs data/real/us/ from here.
#
# Rules the scripts enforce (do not change here): honest user agent "FindTheChurch/0.1 (+https://oakland-diocese-dashboard.vercel.app/about)",
# robots.txt and Crawl-delay honoured, <=1 request/s per host, one request at a time per host, one crawler per host
# (discovermass.com: 10.5 s, ONE job; gcatholic.org: ONE job), challenges/403/429 recorded and never evaded, privacy
# screen on everything saved. The site-crawl matrix runs on DISJOINT state groups, so no host sees two runners.
#
# Disable: Actions tab -> "National crawl" -> Disable workflow. Run by hand: "Run workflow" (job, minutes).
name: National crawl

on:
  schedule:
    - cron: '7 */2 * * *'        # every 2 h (UTC); a job still running makes the next one wait (no overlap per host)
  workflow_dispatch:
    inputs:
      job:
        description: 'which job (sites | reparse | render | discovermass | gcatholic | commoncrawl | osm | wayback | bulletins | movements | all)'
        default: 'all'
      minutes:
        description: 'minutes per chunk'
        default: '110'

permissions:
  contents: write
  actions: write   # the chain job dispatches the next round

env:
  MINUTES: ${{ github.event.inputs.minutes || '110' }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sites:
    # job=reparse runs this same matrix without crawling: each runner restores ITS OWN state group's raw cache (the cache keys
    # are per matrix index, so a separate job would see none) and re-parses it with the current parser.
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'sites' || github.event.inputs.job == 'reparse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        # 14 disjoint state groups balanced by church count (CA is built in the main repo); with the 5 single-host jobs that
        # fills the 20-concurrent-runner cap (with 6 wayback shards a round wants 24: the extra jobs queue, see wayback).
        # Disjoint states = disjoint hosts.
        states:
          - 'NY'
          - 'PA'
          - 'TX'
          - 'IL,GA,UT'
          - 'OH,ND,VT,AK'
          - 'MI,NM,ME,NV'
          - 'WI,CO,AL,AR'
          - 'NJ,KY,OK,ID'
          - 'MN,WA,SD,SC'
          - 'MA,MD,NC,NH'
          - 'FL,NE,VA,RI,DC'
          - 'LA,KS,AZ,WV,HI'
          - 'MO,CT,OR,MS,WY'
          - 'IA,IN,MT,TN,DE'
    concurrency:
      group: crawl-sites-${{ strategy.job-index }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "fold-crawl[bot]" && git config user.email "crawl@narthexlabs.invalid"
      - uses: actions/cache@v4
        with:
          path: data/raw/us/sites
          key: raw-sites-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: raw-sites-${{ strategy.job-index }}-
      - run: sudo pip3 install -q --break-system-packages requests beautifulsoup4 lxml   # system site: visible to python3 -I
      - name: Parish-website crawl chunk (128 hosts in parallel, one request at a time per host)
        if: ${{ github.event.inputs.job != 'reparse' }}
        env:
          WORKERS: '128'
          STATES: ${{ matrix.states }}
          SKIP_PROBE: ${{ strategy.job-index == 0 && '0' || '1' }}
        run: bash scripts/us/sites_chunk.sh "$MINUTES"
      - name: Re-parse this group's cached sites with the current parser (same runner, same cache; once per parser version, resumable)
        if: ${{ always() }}
        env:
          STATES: ${{ matrix.states }}
          RMIN: ${{ github.event.inputs.job == 'reparse' && (github.event.inputs.minutes || '60') || '20' }}
        run: |
          set -u
          TRAILER=$'\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01SXKUYETifPNNjUVPkZ7qG5'
          git rebase --abort 2>/dev/null || true
          git pull --rebase -X theirs --autostash -q origin main || { git rebase --abort 2>/dev/null || true; }
          timeout $(( RMIN * 60 + 600 )) python3 -I ingest/us/sites/run_state.py reparse --state "$STATES" --minutes "$RMIN" || true
          if [ -f data/raw/us/sites/_last_touched.json ]; then
            for d in $(python3 -c "import json;print(' '.join(json.load(open('data/raw/us/sites/_last_touched.json'))))"); do
              git add "data/real/us/sites/$d/" && git commit -q -m "US parish sites: re-parse $d (current parser, runner cache)$TRAILER" 2>/dev/null
            done
          fi
          git add data/real/us/sites/progress.json data/real/us/sites/README.md
          git commit -q -m "US parish sites: re-parse progress $(date -u +%FT%H:%MZ)$TRAILER" 2>/dev/null || true
          for i in 1 2 3 4; do
            git pull --rebase -X theirs --autostash -q origin main || { git rebase --abort 2>/dev/null || true; }
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 20 + 5))
          done

  render:
    # Dispatch only (job=render). Re-reads, ONCE, sites that answered the plain crawl (crawl_status ok: never a challenge/403
    # host) with Mass times but no groups and a JS site builder (Wix, Duda, Squarespace, Weebly, Google Sites), in headless
    # Chromium with the honest FindTheChurch user agent; see ingest/us/sites/render_fetch.py. 4 disjoint shards by
    # sha1(domain) % 4, so no host sees two runners; one page at a time per host, robots.txt and Crawl-delay honoured.
    if: ${{ github.event.inputs.job == 'render' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    concurrency:
      group: crawl-render-${{ strategy.job-index }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "Matthew" && git config user.email "mcolt4@gmail.com"
      - run: sudo pip3 install -q --break-system-packages requests beautifulsoup4 lxml playwright   # system site: visible to python3 -I
      - run: python3 -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: data/raw/us/sites
          key: raw-render-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: raw-render-${{ strategy.job-index }}-
      - name: Rendered re-read of JS-built parish sites (this shard), parse, commit, push
        env:
          SHARD: ${{ matrix.shard }}
          RMIN: ${{ github.event.inputs.minutes || '60' }}
        run: |
          set -u
          TRAILER=$'\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01SXKUYETifPNNjUVPkZ7qG5'
          RMIN=$(( RMIN > 95 ? 95 : RMIN ))
          rm -f data/raw/us/sites/_last_touched.json
          timeout $(( RMIN * 60 + 300 )) python3 -I ingest/us/sites/render_fetch.py run --minutes "$RMIN" --workers 6 --shard "$SHARD" || true
          if [ -f data/raw/us/sites/_last_touched.json ]; then
            for d in $(python3 -c "import json;print(' '.join(json.load(open('data/raw/us/sites/_last_touched.json'))))"); do
              git add "data/real/us/sites/$d/" && git commit -q -m "US parish sites: rendered re-read, $d (shard $SHARD)$TRAILER" 2>/dev/null
            done
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash -q origin main || { git rebase --abort 2>/dev/null || true; }
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 20 + 5))
          done

  discovermass:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'discovermass' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency: { group: crawl-discovermass, cancel-in-progress: false }   # ONE crawler on this host, ever
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "fold-crawl[bot]" && git config user.email "crawl@narthexlabs.invalid"
      - uses: actions/cache@v4
        with:
          path: data/raw/us/discovermass
          key: raw-discovermass-${{ github.run_id }}
          restore-keys: raw-discovermass-
      - name: DiscoverMass address-book chunk (10.5 s between requests; secondary source)
        run: bash scripts/us/discovermass_chunk.sh "$MINUTES" "$GITHUB_WORKSPACE"

  gcatholic:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'gcatholic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency: { group: crawl-gcatholic, cancel-in-progress: false }      # one crawler on this host
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "fold-crawl[bot]" && git config user.email "crawl@narthexlabs.invalid"
      - uses: actions/cache@v4
        with:
          path: data/raw/us/url_sources/gcatholic
          key: raw-gcatholic-${{ github.run_id }}
          restore-keys: raw-gcatholic-
      - name: GCatholic church pages → parish website lists (1 request/s)
        run: |
          set -e
          python3 -u ingest/us/url_sources/gcatholic.py --minutes "$MINUTES" || true
          python3 -I ingest/us/url_sources/gcatholic.py --build
          git add data/real/us/url_sources/gcatholic data/real/us/url_sources/gcatholic.json
          git commit -q -m "G8: GCatholic progress (Actions $(date -u +%FT%H:%MZ))" || true
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main

  commoncrawl:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'commoncrawl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency: { group: crawl-commoncrawl, cancel-in-progress: false }    # one client on index.commoncrawl.org
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "Matthew" && git config user.email "mcolt4@gmail.com"
      - uses: actions/cache@v4
        with:
          path: data/raw/us/url_sources/commoncrawl
          key: raw-commoncrawl-${{ github.run_id }}
          restore-keys: raw-commoncrawl-
      - name: Common Crawl index (CDX API) -> parish domains (<=1 request/s, backoff on 503/429)
        run: |
          set -e
          python3 -u ingest/us/url_sources/commoncrawl.py --probe || true
          python3 -u ingest/us/url_sources/commoncrawl.py --minutes "$MINUTES" || true
          python3 -I ingest/us/url_sources/commoncrawl.py --build
          git add data/real/us/url_sources/commoncrawl data/real/us/url_sources/commoncrawl.json
          git commit -q -m "Common Crawl index: parish domains (Actions $(date -u +%FT%H:%MZ))" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01SXKUYETifPNNjUVPkZ7qG5" || true
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main

  osm:
    # one-off style: not on the schedule; dispatch job=osm until every state is done (resumable per state)
    if: ${{ github.event.inputs.job == 'osm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency: { group: crawl-osm, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "Matthew" && git config user.email "mcolt4@gmail.com"
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null || true
          pip install osmium
          df -h / | tail -1
      - uses: actions/cache@v4
        with:
          path: data/raw/us/url_sources/osm
          key: raw-osm-${{ github.run_id }}
          restore-keys: raw-osm-
      - name: OpenStreetMap Geofabrik state extracts -> Catholic churches with a website tag (one state at a time, file deleted after)
        run: |
          set -e
          python3 -u ingest/us/url_sources/osm_pbf.py --minutes "$MINUTES" || true
          python3 -I ingest/us/url_sources/osm_pbf.py --build
          git add data/real/us/url_sources/osm data/real/us/url_sources/osm.json
          git commit -q -m "OpenStreetMap (Geofabrik) parish websites (Actions $(date -u +%FT%H:%MZ))" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01SXKUYETifPNNjUVPkZ7qG5" || true
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main

  wayback:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'wayback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        # six clients on web.archive.org, disjoint targets (Matthew 2026-11-01 16:29; was three since 09:24). Shards are
        # crc32(key) % 6; each shard writes its own state file, but every shard skips what ANY *_state*.json ever finished,
        # so the 3 -> 6 change re-tries nothing. Concurrency: with the 14 sites jobs + discovermass + gcatholic + bulletins +
        # commoncrawl a round now wants 24 jobs, over the 20-concurrent-job cap of a free account; the surplus simply queues
        # and starts when the sites jobs end (they finish in minutes). Nothing here relies on all jobs starting at once.
        shard: ['0/6', '1/6', '2/6', '3/6', '4/6', '5/6']
    concurrency:
      group: crawl-wayback-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "Matthew" && git config user.email "mcolt4@gmail.com"
      - run: sudo pip3 install -q --break-system-packages requests beautifulsoup4 lxml   # system site: visible to python3 -I
      - uses: actions/cache@v4
        with:
          path: data/raw/us/wayback
          key: raw-wayback-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: raw-wayback-${{ strategy.job-index }}-
      - name: Wayback Machine - archived diocese directories + parish sites we cannot read live (<=1 request/s, honest UA)
        env:
          WB_SHARD: ${{ matrix.shard }}
        run: python3 -u ingest/us/wayback/run.py --minutes "$MINUTES" --git

  movements:
    # Dispatch only (job=movements). Lane D: Knights of Columbus "Find a Council" JSON endpoint, queried by the ZIP codes of
    # our parishes (data/real/us/movements/parish_index.json), one request at a time >= 1.05 s apart, robots.txt honoured;
    # councils matched to parishes by name + city (ingest/us/movements/match.py). Resumable: kofc_progress.json.
    if: ${{ github.event.inputs.job == 'movements' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: crawl-movements, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "Matthew" && git config user.email "mcolt4@gmail.com"
      - name: Knights of Columbus councils near our parishes -> match -> by_parish.json
        run: |
          set -u
          TRAILER=$'\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01SXKUYETifPNNjUVPkZ7qG5'
          timeout $(( MINUTES * 60 + 300 )) python3 -I -u ingest/us/movements/kofc.py --minutes "$MINUTES" || true
          python3 -I ingest/us/movements/match.py
          git add data/real/us/movements/
          git commit -q -m "Movements: Knights of Columbus councils (Actions $(date -u +%FT%H:%MZ))$TRAILER" || true
          for i in 1 2 3 4; do
            git pull --rebase -X theirs --autostash -q origin main || { git rebase --abort 2>/dev/null || true; }
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 20 + 5))
          done

  bulletins:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'bulletins' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency: { group: crawl-bulletins, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config user.name "fold-crawl[bot]" && git config user.email "crawl@narthexlabs.invalid"
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils tesseract-ocr >/dev/null
      - uses: actions/cache@v4
        with:
          path: data/raw/us/bulletins
          key: raw-bulletins-${{ github.run_id }}
          restore-keys: raw-bulletins-
      - name: Bulletins → groups chunk (only bulletin links already seen; never discovermass.com)
        run: |
          set -e
          bash scripts/us/bulletins_chunk.sh "$MINUTES" || true
          git add data/real/us/bulletins && git commit -q -m "US parish bulletins (Actions $(date -u +%FT%H:%MZ))" || true
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main

  chain:
    # GitHub's cron has not fired on this repo, so each round dispatches the next one when its jobs are done
    # (workflow_dispatch via the API with GITHUB_TOKEN does start a run). Disable the workflow to stop the chain.
    needs: [sites, discovermass, gcatholic, bulletins, wayback]
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.job == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          sleep 60
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/dispatches \
            -d '{"ref":"main","inputs":{"job":"all","minutes":"110"}}' && echo "next round dispatched"
